<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1c18;
    --dim: #5c6157;
    --line: #e2e5dd;
    --link: #2f6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14180f;
      --fg: #e8ebe3;
      --dim: #9aa191;
      --line: #2a2f22;
      --link: #8fd39c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px 64px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.1rem; margin: 40px 0 4px; }
  p { margin: 0 0 8px; color: var(--dim); }
  ul { list-style: none; padding: 0; margin: 16px 0 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { color: var(--link); text-decoration: none; display: block; padding: 12px 2px; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 48px; color: var(--dim); font-size: 0.9rem; }
</style>
</head>
