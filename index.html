<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정석야구</title>
<meta name="description" content="다른 감독님들과 겨루는 야구 구단 경영 시뮬레이션">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1c18;
    --dim: #5c6157;
    --line: #e2e5dd;
    --link: #2f6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14180f;
      --fg: #e8ebe3;
      --dim: #9aa191;
      --line: #2a2f22;
      --link: #8fd39c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px 64px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; }
  header img { width: 60px; height: 60px; border-radius: 12px; image-rendering: pixelated; }
  h1 { font-size: 1.7rem; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 1rem; margin: 40px 0 0; color: var(--dim); font-weight: 600; }
  p { margin: 4px 0 0; color: var(--dim); }
  ul { list-style: none; padding: 0; margin: 12px 0 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { color: var(--link); text-decoration: none; display: block; padding: 12px 2px; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--dim); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="정석야구" width="60" height="60">
    <h1>정석야구</h1>
  </header>
  <p>다른 감독님들과 겨루는 야구 구단 경영 시뮬레이션</p>

  <h2>약관 및 정책</h2>
  <ul>
    <li><a href="/baseball-legal/terms.html">이용약관</a></li>
    <li><a href="/baseball-legal/privacy.html">개인정보처리방침</a></li>
    <li><a href="/baseball-legal/probability.html">확률 정보 공시</a></li>
    <li><a href="/baseball-legal/delete.html">계정 삭제 요청</a></li>
  </ul>

  <footer>
    제작 HanPix<br>
    문의 hanpix.support@gmail.com

</html>
